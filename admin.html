
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEROLA - Admin Dashboard</title>

    <!-- OneSignal -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];

        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({
                appId: "3ef08bbe-ea30-49a8-bff7-4b0a54e7304a",
                safari_web_id: "web.onesignal.auto.6187ce57-f346-4a86-93e4-7d70d494c000"
            });
        });
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>MEROLA</h1>
    <nav>
        <a href="index.html">Store</a>
        <a href="admin.html">Products</a>
        <a href="orders.html">Customer Orders</a>
    </nav>
</header>

<main class="admin-container">

    <section id="login-section">
        <h2>Admin Login</h2>

        <form id="login-form">
            <input
                type="email"
                id="login-email"
                placeholder="Admin Email"
                required
            >

            <input
                type="password"
                id="login-password"
                placeholder="Password"
                required
            >

            <button type="submit">LOGIN</button>
        </form>
    </section>

    <section id="dashboard-section" hidden>

        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Manage Products</h2>
            <button type="button" id="logout-button">LOG OUT</button>
        </div>

        <!-- PUSH NOTIFICATIONS -->
        <section id="notification-section" style="margin:25px 0; padding:20px; border:1px solid #e5cbd2; border-radius:12px;">
            <h2>MEROLA Notifications</h2>
            <p>Activate notifications to receive new order alerts.</p>

            <button type="button" id="enable-notifications">
                ENABLE NOTIFICATIONS
            </button>

            <p id="notification-status" aria-live="polite"></p>
        </section>

        <form id="product-form">

            <input type="hidden" id="product-id">

            <input
                type="text"
                id="product-name"
                placeholder="Product Name"
                required
            >

            <select id="product-category" required>
                <option value="hair">Hair Care</option>
                <option value="skin">Skin Care</option>
            </select>

            <textarea
                id="product-description"
                placeholder="Product Description"
                required
            ></textarea>

            <input
                type="number"
                id="product-price"
                placeholder="Current Price"
                min="0"
                step="0.01"
            >

            <input
                type="number"
                id="product-old-price"
                placeholder="Original Price"
                min="0"
                step="0.01"
            >

            <input type="date" id="product-offer-date">

            <div class="product-image-upload" style="margin:15px 0;">
                <label for="product-image" style="display:block; margin-bottom:10px;">
                    Product Image
                </label>

                <input
                    type="file"
                    id="product-image"
                    accept="image/*"
                >

                <div id="image-preview-container" hidden style="margin-top:15px;">
                    <img
                        id="image-preview"
                        src=""
                        alt="Product preview"
                        style="width:180px; height:180px; object-fit:cover; border-radius:10px;"
                    >
                </div>

                <p style="font-size:13px; margin-top:8px;">
                    Choose an image from your device. Maximum size: 5 MB.
                </p>
            </div>

            <button type="submit" id="save-product">
                ADD PRODUCT
            </button>

            <button type="button" id="cancel-edit" hidden>
                CANCEL
            </button>

        </form>

        <h2>Current Products</h2>
        <div id="admin-products"></div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const button = document.getElementById("enable-notifications");
        const status = document.getElementById("notification-status");

        button.addEventListener("click", async function() {
            try {
                button.disabled = true;
                status.textContent = "Connecting to notifications...";

                await new Promise(resolve => {
                    window.OneSignalDeferred.push(resolve);
                });

                await OneSignal.Notifications.requestPermission();

                status.textContent = "Notification permission request completed. Check your browser permission.";
            } catch (error) {
                console.error("OneSignal error:", error);
                status.textContent = "Could not activate notifications. Please try again.";
            } finally {
                button.disabled = false;
            }
        });
    });
</script>

</body>
</html>
