
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEROLA - Admin Dashboard</title>

    <!-- OneSignal -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];

        window.merolaOneSignalReady = new Promise((resolve, reject) => {
            window.OneSignalDeferred.push(async function(OneSignal) {
                try {
                    await OneSignal.init({
                        appId: "3ef08bbe-ea30-49a8-bff7-4b0a54e7304a",
                        safari_web_id: "web.onesignal.auto.6187ce57-f346-4a86-93e4-7d70d494c000",
                        serviceWorkerPath: "/MEROLA/OneSignalSDKWorker.js",
                        serviceWorkerParam: {
                            scope: "/MEROLA/"
                        }
                    });

                    resolve(OneSignal);

                } catch (error) {
                    console.error("OneSignal initialization failed:", error);
                    reject(error);
                }
            });
        });
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>MEROLA</h1>

    <nav>
        <a href="index.html">Store</a>
        <a href="admin.html">Products</a>
        <a href="orders.html">Customer Orders</a>
    </nav>
</header>

<main class="admin-container">

    <!-- ADMIN LOGIN -->
    <section id="login-section">

        <h2>Admin Login</h2>

        <form id="login-form">

            <input
                type="email"
                id="login-email"
                placeholder="Admin Email"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="login-password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">LOGIN</button>

        </form>

    </section>

    <!-- ADMIN DASHBOARD -->
    <section id="dashboard-section" hidden>

        <div style="display:flex; justify-content:space-between; align-items:center;">

            <h2>Manage Products</h2>

            <button type="button" id="logout-button">
                LOG OUT
            </button>

        </div>

        <!-- PUSH NOTIFICATIONS -->
        <section
            id="notification-section"
            style="margin:25px 0; padding:20px; border:1px solid #e5cbd2; border-radius:12px;"
        >

            <h2>MEROLA Notifications</h2>

            <p>
                Activate notifications to receive new order alerts.
            </p>

            <button type="button" id="enable-notifications">
                ENABLE NOTIFICATIONS
            </button>

            <p id="notification-status" aria-live="polite"></p>

        </section>

        <!-- PRODUCT FORM -->
        <form id="product-form">

            <input type="hidden" id="product-id">

            <input
                type="text"
                id="product-name"
                placeholder="Product Name"
                required
            >

            <select id="product-category" required>
                <option value="hair">Hair Care</option>
                <option value="skin">Skin Care</option>
            </select>

            <textarea
                id="product-description"
                placeholder="Product Description"
                required
            ></textarea>

            <input
                type="number"
                id="product-price"
                placeholder="Current Price"
                min="0"
                step="0.01"
            >

            <input
                type="number"
                id="product-old-price"
                placeholder="Original Price"
                min="0"
                step="0.01"
            >

            <input type="date" id="product-offer-date">

            <!-- PRODUCT IMAGE -->
            <div class="product-image-upload" style="margin:15px 0;">

                <label
                    for="product-image"
                    style="display:block; margin-bottom:10px;"
                >
                    Product Image
                </label>

                <input
                    type="file"
                    id="product-image"
                    accept="image/*"
                >

                <div
                    id="image-preview-container"
                    hidden
                    style="margin-top:15px;"
                >

                    <img
                        id="image-preview"
                        src=""
                        alt="Product preview"
                        style="width:180px; height:180px; object-fit:cover; border-radius:10px;"
                    >

                </div>

                <p style="font-size:13px; margin-top:8px;">
                    Choose an image from your device. Maximum size: 5 MB.
                </p>

            </div>

            <button type="submit" id="save-product">
                ADD PRODUCT
            </button>

            <button type="button" id="cancel-edit" hidden>
                CANCEL
            </button>

        </form>

        <!-- CURRENT PRODUCTS -->
        <h2>Current Products</h2>

        <div id="admin-products"></div>

    </section>

</main>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="admin.js"></script>

<!-- ONESIGNAL SUBSCRIPTION -->
<script>
    const notificationButton = document.getElementById("enable-notifications");
    const notificationStatus = document.getElementById("notification-status");

    notificationButton.addEventListener("click", async function() {

        notificationButton.disabled = true;
        notificationStatus.textContent = "Connecting to notifications...";

        try {

            const OneSignal = await window.merolaOneSignalReady;

            await OneSignal.Notifications.requestPermission();

            if (Notification.permission === "granted") {
                notificationStatus.textContent =
                    "Permission granted. Checking subscription...";

                await OneSignal.User.PushSubscription.optIn();

                notificationStatus.textContent =
                    "Notification subscription requested successfully.";

            } else {
                notificationStatus.textContent =
                    "Notification permission was not granted.";
            }

        } catch (error) {

            console.error("OneSignal Error:", error);

            notificationStatus.textContent =
                "Connection failed. Check browser console.";

        } finally {

            notificationButton.disabled = false;

        }

    });
</script>

</body>
</html>
