
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEROLA | Special Offers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <a href="index.html" class="logo">MEROLA</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="hair-care.html">Hair Care</a>
            <a href="skin-care.html">Skin Care</a>
            <a href="offers.html">Offers</a>
            <a href="index.html#about">About Us</a>
            <a href="index.html#contact">Contact</a>
        </nav>

        <div class="cart" onclick="toggleCart()">
            🛒 <span id="cart-count">0</span>
        </div>

    </header>


    <!-- OFFERS BANNER -->
    <section class="category-hero offers-hero">

        <span>MEROLA SPECIAL OFFERS</span>

        <h1>Beauty Deals You'll Love</h1>

        <p>
            Explore exclusive offers on MEROLA
            hair and skincare essentials.
        </p>

    </section>


    <!-- SPECIAL OFFERS -->
    <section class="category-section">

        <div class="section-title">

            <span>LIMITED TIME DEALS</span>

            <h2>Our Special Offers</h2>

            <p>
                Discover our latest deals and exclusive prices
            </p>

        </div>

        <div class="product-container" id="offer-products"></div>

    </section>


    <!-- SHOPPING CART -->
    <div class="cart-box" id="cart-box">

        <div class="cart-header">

            <h2>My Shopping Cart</h2>

            <button onclick="toggleCart()">×</button>

        </div>

        <div id="cart-items"></div>

        <div class="cart-total">

            <h3>
                Total:
                <span id="cart-total">0</span> EGP
            </h3>

        </div>

        <button class="checkout-btn" onclick="checkout()">
            CHECKOUT
        </button>

    </div>


    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>

</body>

</html>
